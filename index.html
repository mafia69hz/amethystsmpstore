<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmethystSMP Store</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#121212;
    color:white;
    text-align:center;
}
header{
    background:#8A2BE2;
    padding:25px;
}
h1{
    margin:0;
}
.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    padding:40px;
}
.card{
    background:#1f1f1f;
    border-radius:12px;
    padding:20px;
    width:250px;
    box-shadow:0 0 10px rgba(138,43,226,.5);
}
.price{
    color:#00ff99;
    font-size:24px;
    font-weight:bold;
}
button{
    background:#8A2BE2;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}
button:hover{
    background:#6f1fd1;
}
footer{
    margin-top:30px;
    padding:20px;
    background:#181818;
}
</style>
</head>
<body>

<header>
    <h1>💎 AmethystSMP Store 💎</h1>
    <p>Susține serverul și primește recompense!</p>
</header>

<div class="container">

<div class="card">
<h2>Grad Amethyst</h2>
<p>Cel mai special grad de pe server.</p>
<p class="price">50 Lei</p>
<button>Cumpără</button>
</div>

<div class="card">
<h2>100 Points</h2>
<p class="price">5 Lei</p>
<button>Cumpără</button>
</div>

<div class="card">
<h2>500 Points</h2>
<p class="price">15 Lei</p>
<button>Cumpără</button>
</div>

<div class="card">
<h2>750 Points</h2>
<p class="price">25 Lei</p>
<button>Cumpără</button>
</div>

<div class="card">
<h2>1500 Points</h2>
<p class="price">50 Lei</p>
<button>Cumpără</button>
</div>

</div>

<footer>
<p>© 2026 AmethystSMP Store</p>
</footer>

</body>
</html>
